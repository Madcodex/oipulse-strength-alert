<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OI Pulse Strength</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header card fade-in">
        <div class="header-left">
          <div class="brand-row">
            <span class="brand-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
              </svg>
            </span>
            <div>
              <h1>OI Pulse Strength</h1>
              <p class="subtitle">Live Monitoring</p>
            </div>
          </div>
        </div>

        <div class="header-right">
          <button id="openTabBtn" type="button" class="btn-icon" title="Open full terminal in new tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            </svg>
            <span>Open in tab</span>
          </button>
          <label class="monitor-switch" for="alertsToggle" title="Alert every 3 minutes while threshold is breached">
            <span class="live-pill" id="alertsPill">
              <span class="live-dot" aria-hidden="true"></span>
              <span id="alertsLabel">Alerts OFF</span>
            </span>
            <input type="checkbox" id="alertsToggle" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </label>
          <label class="monitor-switch" for="monitoringToggle">
            <span class="live-pill" id="livePill">
              <span class="live-dot" aria-hidden="true"></span>
              <span id="monitorLabel">Monitoring OFF</span>
            </span>
            <input type="checkbox" id="monitoringToggle" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </label>
        </div>
      </header>

      <section class="stats-grid fade-in delay-1">
        <article class="stat-card">
          <div class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            Strength
          </div>
          <div id="strengthValue" class="stat-value strength">—</div>
        </article>

        <article class="stat-card">
          <div class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 7 5 5-5 5"/><path d="M21 12H9"/><path d="M3 19V5"/></svg>
            Sentiment
          </div>
          <div class="stat-value-wrap">
            <span id="sentimentValue" class="pill pill-neutral">—</span>
          </div>
        </article>

        <article class="stat-card">
          <div class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            Last Scrape
          </div>
          <div id="scrapedAt" class="stat-meta">—</div>
        </article>

        <article class="stat-card">
          <div class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
            Rows
          </div>
          <div id="rowCount" class="stat-value rows">—</div>
        </article>
      </section>

      <section class="actions fade-in delay-2">
        <button id="scrapeBtn" type="button" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          Scrape now
        </button>
        <button id="summarizeBtn" type="button" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/></svg>
          Summarize 2h
        </button>
        <button id="downloadBtn" type="button" class="btn btn-ghost btn-full">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          Download JSON
        </button>
      </section>

      <section class="card alert-card fade-in delay-3">
        <div class="alert-inline">
          <div class="alert-inline-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            Alert
          </div>
          <div class="alert-body" id="lastAlert">
            <div class="alert-empty">No alerts yet</div>
          </div>
        </div>
        <div class="alert-meta-row">
          <span class="muted" id="storageInfo">Stored in chrome.storage.local</span>
          <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="card summary-card fade-in delay-4">
        <div class="card-head">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/></svg>
            AI Market Summary
          </div>
          <span id="summaryMeta" class="model-badge">Awaiting data</span>
        </div>
        <div id="summaryText" class="summary-content" tabindex="0">
          <div class="summary-placeholder">
            <p>Run <strong>Summarize 2h</strong> to generate a terminal-grade market brief from the latest OI table.</p>
          </div>
        </div>
      </section>

      <footer class="footer fade-in delay-5">
        <a href="#" id="optionsLink">Options &amp; LLM settings</a>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
